<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scheduler | Notary Services</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/scheduler.css" />
  </head>
  <body>
    <main class="scheduler-main">
      <p><a href="../index.html">Back to Home</a></p>
      <h1>Book an Appointment</h1>
      <p>Select an available time slot, then complete the form.</p>

      <section class="scheduler-layout" aria-label="Appointment scheduler">
        <div class="calendar-panel">
          <h2>Availability</h2>
          <div class="calendar-toolbar" aria-label="Calendar navigation">
            <button id="prevMonth" type="button" class="month-nav" aria-label="Previous month">Prev</button>
            <p id="monthLabel" class="month-label" aria-live="polite"></p>
            <button id="nextMonth" type="button" class="month-nav" aria-label="Next month">Next</button>
          </div>

          <div class="calendar-weekdays" aria-hidden="true">
            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
          </div>

          <div id="calendar" class="calendar-grid" aria-live="polite"></div>

          <section id="daySlots" class="day-slots" aria-live="polite"></section>
        </div>

        <div class="booking-panel">
          <h2>Booking Details</h2>
          <form id="bookingForm">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required />

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />

            <label for="signatureCount">Number of Signatures</label>
            <input id="signatureCount" name="signatureCount" type="number" min="1" step="1" value="1" required />
            <p id="durationHint" class="duration-hint" aria-live="polite"></p>

            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4"></textarea>

            <input id="selectedDatetime" name="selectedDatetime" type="hidden" />

            <button type="submit">Book appointment</button>
          </form>

          <p id="message" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script src="../assets/js/theme.js" defer></script>
    <script src="../assets/js/scheduler.js" defer></script>
  </body>
</html>
